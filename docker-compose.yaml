
networks:
  poc-net:
    driver: bridge

volumes:
  minio_data:

services:

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - poc-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - ./microservices.py:/demo/microservices.py:ro
    depends_on:
      - zookeeper
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - poc-net

  # MinIO (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - poc-net

  # Conductor Server (Custom build with Kafka event queue support)
  conductor-server:
    build: ./conductor-custom
    container_name: conductor-server
    environment:
      - LOAD_SAMPLE=false
      
      # Disable Datadog metrics (not needed for POC)
      - management.metrics.export.datadog.enabled=false
      
      # Kafka Event Queue Configuration
      - conductor.event-queues.kafka.enabled=true
      - conductor.event-queues.kafka.bootstrap-servers=kafka:9092
      - conductor.default-event-queue.type=kafka
      
      # Event Processor
      - conductor.event-processor.enabled=true
      - conductor.event-processor.kafka.enabled=true
      - conductor.event-processor.kafka.bootstrap-servers=kafka:9092
      
      # Spring Kafka
      - spring.kafka.bootstrap-servers=kafka:9092
      - spring.kafka.consumer.group-id=conductor-events
      
      # Logging (for debugging)
      - logging.level.com.netflix.conductor.core.events=INFO
      - logging.level.com.netflix.conductor.contribs.queue.kafka=INFO
    ports:
      - "8080:8080" 
      - "5000:5000" # UI
    networks:
      - poc-net
    depends_on:
      - kafka
      - zookeeper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  
  # Worker (handles SIMPLE tasks and Kafka consumption)
  worker:
    build: ./worker
    container_name: conductor-worker
    depends_on:
      - conductor-server
      - kafka
    environment:
      - CONDUCTOR_SERVER_URL=http://conductor-server:8080/api
      - KAFKA_BOOTSTRAP=kafka:9092
    networks:
      - poc-net
    restart: unless-stopped

  # Microservices (Kafka consumers/producers)
  microservices:
    image: python:3.9-slim
    container_name: microservices
    command: bash -c "pip install kafka-python==2.0.2 && python -u /app/microservices.py"
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
    volumes:
      - ./microservices.py:/app/microservices.py:ro
    networks:
      - poc-net
    restart: unless-stopped
