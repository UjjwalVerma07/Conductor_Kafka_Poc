
networks:
  pipeline-net:
    driver: bridge

volumes:
  minio_data:

services:

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-full
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pipeline-net

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-full
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - pipeline-net

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: minio-full
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pipeline-net

  # Conductor Server
  conductor-server:
    build: ../conductor-custom
    container_name: conductor-server-full
    environment:
      - LOAD_SAMPLE=false
      - management.metrics.export.datadog.enabled=false
      - conductor.event-queues.kafka.enabled=true
      - conductor.event-queues.kafka.bootstrap-servers=kafka:9092
      - conductor.default-event-queue.type=kafka
      - conductor.event-processor.enabled=true
      - conductor.event-processor.kafka.enabled=true
      - conductor.event-processor.kafka.bootstrap-servers=kafka:9092
      - spring.kafka.bootstrap-servers=kafka:9092
      - spring.kafka.consumer.group-id=conductor-events
      - logging.level.com.netflix.conductor.core.events=INFO
      - logging.level.com.netflix.conductor.contribs.queue.kafka=INFO
    ports:
      - "8080:8080" 
      - "5000:5000"
    networks:
      - pipeline-net
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Conductor Worker (Kafka + MinIO)
  worker:
    build: ./worker
    container_name: pipeline-worker
    depends_on:
      conductor-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - CONDUCTOR_SERVER_URL=http://conductor-server:8080/api
      - KAFKA_BOOTSTRAP=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
    networks:
      - pipeline-net
    restart: unless-stopped

  # Email Validator Service
  email-validator:
    build: ./services/email_validator
    container_name: email-validator-service
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - SERVICE_NAME=email-validator
      - STAGE=1
    networks:
      - pipeline-net
    restart: unless-stopped

  # Phone Validator Service
  phone-validator:
    build: ./services/phone_validator
    container_name: phone-validator-service
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - SERVICE_NAME=phone-validator
      - STAGE=2
    networks:
      - pipeline-net
    restart: unless-stopped

  # Enricher Service
  enricher:
    build: ./services/enricher
    container_name: enricher-service
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - SERVICE_NAME=enricher
      - STAGE=3
    networks:
      - pipeline-net
    restart: unless-stopped

